<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini 图片生成工具</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0b1020;
            color: #e5e7eb;
        }

        .wrap {
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .card {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 16px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
        }

        @media (max-width: 860px) {
            .card {
                grid-template-columns: 1fr;
            }
        }

        /* ====== 顶部 Tab ====== */
        .top-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 16px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #374151;
        }

        .top-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            background: #0f172a;
            color: #94a3b8;
            transition: .15s;
            user-select: none;
            text-decoration: none;
        }

        .top-tab.active {
            background: #2563eb;
            color: #fff;
        }

        .top-tab:not(:last-child) {
            border-right: 1px solid #374151;
        }

        .tab-page {
            display: none;
        }

        .tab-page.active {
            display: block;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 22px;
            grid-column: 1 / -1;
        }

        .sub {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 0;
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 4px;
            display: block;
        }

        input,
        textarea,
        select {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #374151;
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
        }

        select {
            appearance: none;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            border: 0;
            background: #2563eb;
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        button.secondary {
            background: #374151;
        }

        /* ====== 提示词增强与操作栏 ====== */
        .prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .prompt-header label {
            margin-bottom: 0;
        }

        .prompt-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .prompt-counter {
            font-size: 12px;
            color: #64748b;
            margin-right: 2px;
        }

        .action-link-btn {
            background: none;
            border: 1px solid #374151;
            color: #93c5fd;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all .15s ease;
            white-space: nowrap;
        }

        .action-link-btn:hover {
            background: #1e3a5f;
            color: #fff;
            border-color: #3b82f6;
        }

        .action-link-btn.loading {
            opacity: .7;
            cursor: wait;
        }

        .prompt-chips {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .chip-label {
            font-size: 12px;
            color: #64748b;
        }

        .prompt-chip {
            background: #0f172a;
            border: 1px solid #1e293b;
            color: #94a3b8;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all .15s ease;
        }

        .prompt-chip:hover {
            background: #1e293b;
            color: #e2e8f0;
            border-color: #3b82f6;
        }

        .gen-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .cancel-btn {
            background: #b91c1c !important;
            color: #fff !important;
            padding: 10px 18px;
            min-width: 90px;
        }

        .cancel-btn:hover {
            background: #991b1b !important;
        }

        /* ====== 左栏 ====== */
        .main-panel {
            min-width: 0;
        }

        .setting-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .setting-row3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        @media (max-width: 700px) {
            .setting-row3 {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 500px) {

            .setting-row,
            .setting-row3 {
                grid-template-columns: 1fr;
            }
        }

        /* model 下拉 */
        .combo {
            position: relative;
        }

        .combo-panel {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            z-index: 50;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            max-height: 220px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
        }

        .combo-panel.open {
            display: block;
        }

        .combo-item {
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            color: #e2e8f0;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .combo-item:hover,
        .combo-item.active {
            background: #1e293b;
        }

        .combo-empty {
            padding: 10px 12px;
            font-size: 11px;
            color: #64748b;
        }

        .pwd-wrap {
            position: relative;
        }

        .pwd-wrap input {
            padding-right: 40px;
        }

        .pwd-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: 0;
            color: #6b7280;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            line-height: 1;
        }

        .pwd-toggle:hover {
            color: #e5e7eb;
        }

        /* ====== 多图选择器 ====== */
        .img-picker {
            margin-bottom: 12px;
        }

        .thumb-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .thumb-item {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #374151;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            background: #0a0f18;
        }

        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-item .thumb-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .75);
            color: #e5e7eb;
            border: 0;
            cursor: pointer;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            padding: 0;
            display: none;
        }

        .thumb-item:hover .thumb-remove {
            display: block;
        }

        .thumb-item .thumb-remove:hover {
            background: rgba(185, 28, 28, .9);
        }

        .thumb-add {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            border: 2px dashed #374151;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 28px;
            background: #0f172a;
            transition: .15s;
        }

        .thumb-add:hover {
            border-color: #2563eb;
            color: #3b82f6;
            background: #111d32;
        }

        /* ====== 结果区域 ====== */
        .result-area {
            display: none;
            margin-top: 14px;
            text-align: center;
            animation: fadeInUp .4s ease;
        }

        .result-area.active {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-area img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 10px;
            border: 1px solid #374151;
            cursor: zoom-in;
            animation: fadeInUp .5s ease;
            transition: transform .15s;
        }

        .result-area img:hover {
            transform: scale(1.02);
        }

        .result-info {
            margin-top: 6px;
            font-size: 12px;
            color: #6b7280;
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .status-bar {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            background: #0f172a;
            border: 1px solid #1f2937;
            display: none;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .status-bar.info {
            display: block;
            color: #93c5fd;
            border-color: #1e3a5f;
            background: #0c1929;
        }

        .status-bar.done {
            display: block;
            color: #bbf7d0;
            border-color: #166534;
            background: #052016;
        }

        .status-bar.err {
            display: block;
            color: #fecdd3;
            border-color: #9f1239;
            background: #20060d;
        }

        /* ====== 右栏：实时面板 ====== */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 520px;
            border-left: 1px solid #1f2937;
            padding-left: 16px;
        }

        @media (max-width: 860px) {
            .side-panel {
                border-left: 0;
                padding-left: 0;
                border-top: 1px solid #1f2937;
                padding-top: 14px;
                min-height: 0;
            }
        }

        .side-panel-header {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: .08em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .side-panel-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #1f2937;
        }

        /* loading mini */
        .loading-mini {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            background: #0c1929;
            border: 1px solid #1e3a5f;
        }

        .loading-mini.active {
            display: flex;
        }

        .loading-mini .spinner-sm {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            border: 2px solid #1e3a5f;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-mini .stats-row {
            font-size: 11px;
            color: #64748b;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        /* 事件日志 */
        .event-log {
            display: none;
            flex: 1;
            border: 1px solid #1a2236;
            border-radius: 8px;
            background: #0a0f18;
            overflow-y: auto;
            font-size: 12px;
            min-height: 200px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .event-log.active {
            display: block;
        }

        .event-log .line {
            padding: 2px 10px;
            border-bottom: 1px solid #0c1320;
            display: flex;
            gap: 6px;
            align-items: flex-start;
        }

        .event-log .line:last-child {
            border-bottom: 0;
        }

        .event-log .ts {
            color: #4b5563;
            flex-shrink: 0;
            min-width: 54px;
            font-size: 11px;
        }

        .event-log .tag {
            flex-shrink: 0;
            min-width: 44px;
            font-weight: 600;
            font-size: 11px;
        }

        .event-log .tag.event-tag {
            color: #f59e0b;
        }

        .event-log .tag.data-tag {
            color: #3b82f6;
        }

        .event-log .tag.text-tag {
            color: #6b7280;
        }

        .event-log .tag.done-tag {
            color: #22c55e;
        }

        .event-log .msg {
            color: #9ca3af;
            word-break: break-all;
            flex: 1;
        }

        /* 文本流 */
        .text-stream {
            display: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            background: #0a0f18;
            border: 1px solid #1a2236;
            color: #9ca3af;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            max-height: 180px;
        }

        .text-stream.active {
            display: block;
        }

        /* ====== 全屏预览遮罩 ====== */
        .preview-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, .92);
            cursor: zoom-out;
            align-items: center;
            justify-content: center;
        }

        .preview-overlay.open {
            display: flex;
        }

        .preview-overlay img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 6px;
            user-select: none;
            transition: transform .1s ease;
            cursor: grab;
        }

        .preview-overlay img.dragging {
            cursor: grabbing;
            transition: none;
        }

        .preview-close {
            position: absolute;
            top: 16px;
            right: 24px;
            font-size: 32px;
            color: #9ca3af;
            cursor: pointer;
            line-height: 1;
            z-index: 1;
            user-select: none;
        }

        .preview-close:hover {
            color: #fff;
        }

        .preview-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #6b7280;
            pointer-events: none;
        }

        /* ====== 图片展馆 ====== */
        .gallery-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
        }

        .gallery-card h2 {
            margin: 0 0 4px;
            font-size: 16px;
            color: #e5e7eb;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
            margin-top: 12px;
        }

        .gallery-item {
            background: #0f172a;
            border: 1px solid #1f2937;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: fadeInUp .3s ease;
        }

        .gallery-item .thumb-wrap {
            position: relative;
            overflow: hidden;
            background: #0a0f18;
            cursor: pointer;
        }

        .gallery-item .thumb-wrap img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform .2s;
            aspect-ratio: 1;
            object-fit: cover;
        }

        .gallery-item .thumb-wrap:hover img {
            transform: scale(1.05);
        }

        .gallery-item .thumb-wrap .mode-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(0, 0, 0, .7);
            color: #e5e7eb;
        }

        .gallery-item .ref-row {
            display: flex;
            gap: 4px;
            padding: 4px 6px 0;
            flex-wrap: wrap;
        }

        .gallery-item .ref-thumb {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #374151;
            cursor: pointer;
            flex-shrink: 0;
            background: #0a0f18;
        }

        .gallery-item .ref-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item .ref-thumb:hover {
            border-color: #3b82f6;
        }

        .gallery-item .info {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .gallery-item .info .prompt-text {
            font-size: 12px;
            color: #9ca3af;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            flex: 1;
        }

        .gallery-item .info .prompt-row {
            display: flex;
            gap: 6px;
            align-items: flex-start;
        }

        .gallery-item .info .copy-prompt {
            background: none;
            border: 0;
            color: #4b5563;
            cursor: pointer;
            font-size: 13px;
            padding: 1px 4px;
            line-height: 1;
            flex-shrink: 0;
        }

        .gallery-item .info .copy-prompt:hover {
            color: #e5e7eb;
        }

        .gallery-item .info .meta {
            font-size: 11px;
            color: #4b5563;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .gallery-item .info .record-meta {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .gallery-item .info .del-btn {
            background: none;
            border: 0;
            color: #6b7280;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 6px;
            line-height: 1;
        }

        .gallery-item .info .del-btn:hover {
            color: #ef4444;
        }

        .gallery-empty {
            text-align: center;
            color: #4b5563;
            font-size: 13px;
            padding: 24px 0;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <!-- ============ 顶部 Tab ============ -->
        <div class="top-tabs">
            <a class="top-tab" href="index.html">豆包</a>
            <a class="top-tab active" href="gemini.html">Gemini</a>
            <div class="top-tab" data-page="gallery">图片展馆 <span id="topGalleryBadge"
                    style="font-size:12px;opacity:.7;"></span></div>
        </div>

        <!-- ============ 画图页 ============ -->
        <div id="tabDraw" class="tab-page active">
            <div class="card">
                <h1>Gemini 图片生成</h1>
                <div class="sub">Gemini 原生 generateContent：支持文生图 & 图生图，浏览器直连可能受 CORS 限制</div>

                <!-- ============ 左栏：输入 + 结果 ============ -->
                <div class="main-panel">

                    <div class="setting-row3">
                        <div>
                            <label for="baseUrl">Base URL</label>
                            <input id="baseUrl" placeholder="https://generativelanguage.googleapis.com/v1beta" autocomplete="off" />
                        </div>
                        <div>
                            <label for="apiKey">API Key</label>
                            <div class="pwd-wrap">
                                <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
                                <button id="pwdToggle" class="pwd-toggle" title="显示/隐藏">&#x1f441;</button>
                            </div>
                        </div>
                        <div>
                            <label for="model">生图模型 (Image Model)</label>
                            <div class="combo">
                                <input id="model" placeholder="选择 Gemini 生图模型" autocomplete="off" />
                                <div id="modelPanel" class="combo-panel"></div>
                            </div>
                        </div>
                    </div>

                    <div class="setting-row" style="margin-bottom: 12px;">
                        <div>
                            <label for="promptModel">提示词模型（选填，用于AI润色扩写）</label>
                            <div class="combo">
                                <input id="promptModel" placeholder="选择 Gemini 提示词模型" autocomplete="off" />
                                <div id="promptModelPanel" class="combo-panel"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 参考图片选择器（多图） -->
                    <div class="img-picker">
                        <label>参考图片（可选，支持选择或直接粘贴图片，上传后自动切换为图生图模式）</label>
                        <div class="thumb-row" id="thumbRow">
                            <input id="imageFile" type="file" accept="image/*" multiple style="display:none;" />
                            <div id="thumbAdd" class="thumb-add" title="添加参考图片">+</div>
                        </div>
                    </div>

                    <div>
                        <div class="prompt-header">
                            <label for="prompt">图片描述（提示词）</label>
                            <div class="prompt-actions">
                                <span id="promptCounter" class="prompt-counter">0 字</span>
                                <button id="optimizeBtn" type="button" class="action-link-btn" title="AI智能润色扩写提示词">✨ 优化提示词</button>
                                <button id="revertBtn" type="button" class="action-link-btn" style="display:none;" title="恢复到优化前的提示词">↩ 撤回</button>
                                <button id="clearPromptBtn" type="button" class="action-link-btn" title="清空提示词">清空</button>
                            </div>
                        </div>
                        <div class="prompt-chips">
                            <span class="chip-label">快捷风格：</span>
                            <button type="button" class="prompt-chip" data-style="写实摄影，8k分辨率，真实细节，专业单反，自然光影">写实摄影</button>
                            <button type="button" class="prompt-chip" data-style="唯美动漫二次元，新海诚美学，清透光影，色彩鲜艳，细腻插画">唯美动漫</button>
                            <button type="button" class="prompt-chip" data-style="赛博朋克风，未来科技感，霓虹夜景，雨夜反光，机械质感">赛博朋克</button>
                            <button type="button" class="prompt-chip" data-style="国风古韵水墨画，古典意境，水墨晕染，诗意留白">国风水墨</button>
                            <button type="button" class="prompt-chip" data-style="3D粘土盲盒，泡泡玛特Q版风格，柔和三点光照，哑光材质，超可爱">3D盲盒</button>
                            <button type="button" class="prompt-chip" data-style="电影大片质感，宽银幕构图，35mm胶片，电影级戏剧光影">电影质感</button>
                        </div>
                        <textarea id="prompt" placeholder="例如：一只在雨中奔跑的柴犬，皮克斯动画风格"></textarea>
                    </div>

                    <div class="gen-btn-group">
                        <button id="genBtn" style="flex:1;">生成图片</button>
                        <button id="cancelBtn" type="button" class="secondary cancel-btn" style="display:none;">取消生成</button>
                    </div>

                    <div id="resultArea" class="result-area">
                        <img id="resultImg" alt="生成的图片" />
                        <div class="result-info"><span id="resultStats"></span></div>
                        <div class="actions">
                            <button id="editBtn" class="secondary">编辑这张图</button>
                            <button id="downloadBtn">下载图片</button>
                            <button id="copyBtn" class="secondary">复制到剪贴板</button>
                        </div>
                    </div>

                    <div id="statusBar" class="status-bar"></div>
                </div>

                <!-- ============ 右栏：实时事件流 ============ -->
                <div class="side-panel">
                    <div class="side-panel-header">实时事件流</div>

                    <div id="loadingMini" class="loading-mini">
                        <div class="spinner-sm"></div>
                        <div class="stats-row">
                            <span id="statEvents">📡 事件: 0</span>
                            <span id="statTextLen">📝 文本: 0 字</span>
                            <span id="statElapsed">⏱ 0s</span>
                        </div>
                    </div>

                    <div id="eventLog" class="event-log"></div>
                    <div id="textStream" class="text-stream"></div>
                </div>
            </div>
        </div>

        <!-- ============ 全屏预览遮罩（全局，跨 Tab） ============ -->
        <div id="previewOverlay" class="preview-overlay">
            <span class="preview-close">&times;</span>
            <img id="previewImg" alt="预览" draggable="false" />
            <span class="preview-hint">滚轮缩放 · ESC 关闭</span>
        </div>

        <!-- ============ 图片展馆页 ============ -->
        <div id="tabGallery" class="tab-page">
            <div class="gallery-card">
                <h2>生成记录展馆 <span id="galleryCount" style="font-size:13px;color:#64748b;font-weight:400;"></span></h2>
                <div id="galleryGrid" class="gallery-grid"></div>
                <div id="galleryEmpty" class="gallery-empty" style="display:none;">暂无生成记录，快去生成第一张图片吧</div>
            </div>
        </div>

    </div>

    <script>
        // ========== DOM 引用 ==========
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);
        const els = {
            topTabs: $$('.top-tab'),
            tabDraw: $('#tabDraw'),
            tabGallery: $('#tabGallery'),
            topGalleryBadge: $('#topGalleryBadge'),
            apiKey: $('#apiKey'),
            pwdToggle: $('#pwdToggle'),
            baseUrl: $('#baseUrl'),
            model: $('#model'),
            modelPanel: $('#modelPanel'),
            promptModel: $('#promptModel'),
            promptModelPanel: $('#promptModelPanel'),
            imageFile: $('#imageFile'),
            thumbRow: $('#thumbRow'),
            thumbAdd: $('#thumbAdd'),
            prompt: $('#prompt'),
            promptCounter: $('#promptCounter'),
            optimizeBtn: $('#optimizeBtn'),
            revertBtn: $('#revertBtn'),
            clearPromptBtn: $('#clearPromptBtn'),
            promptChips: $$('.prompt-chip'),
            genBtn: $('#genBtn'),
            cancelBtn: $('#cancelBtn'),
            loadingMini: $('#loadingMini'),
            statEvents: $('#statEvents'),
            statTextLen: $('#statTextLen'),
            statElapsed: $('#statElapsed'),
            eventLog: $('#eventLog'),
            textStream: $('#textStream'),
            statusBar: $('#statusBar'),
            resultArea: $('#resultArea'),
            resultImg: $('#resultImg'),
            resultStats: $('#resultStats'),
            editBtn: $('#editBtn'),
            downloadBtn: $('#downloadBtn'),
            copyBtn: $('#copyBtn'),
            previewOverlay: $('#previewOverlay'),
            previewImg: $('#previewImg'),
            galleryGrid: $('#galleryGrid'),
            galleryCount: $('#galleryCount'),
            galleryEmpty: $('#galleryEmpty'),
        };

        let resultDataUrl = null;
        let resultBlob = null;

        // ========== 多图选择器 ==========
        let refImages = []; // { file, dataUrl, originalSize, compressedSize }
        const REF_IMAGE_MAX_SIDE = 1024;
        const REF_IMAGE_QUALITY = 0.78;

        function formatBytes(bytes) {
            if (!bytes) return '0 B';
            const units = ['B', 'KB', 'MB'];
            let size = bytes;
            let idx = 0;
            while (size >= 1024 && idx < units.length - 1) {
                size /= 1024;
                idx++;
            }
            return `${size.toFixed(idx === 0 ? 0 : 1)} ${units[idx]}`;
        }

        function renderThumbnails() {
            // 清除旧缩略图
            els.thumbRow.querySelectorAll('.thumb-item').forEach((el) => el.remove());
            refImages.forEach((ref, i) => {
                const item = document.createElement('div');
                item.className = 'thumb-item';
                if (ref.originalSize && ref.compressedSize) {
                    item.title = `参考图 ${i + 1}：${formatBytes(ref.originalSize)} → ${formatBytes(ref.compressedSize)}`;
                }
                const img = document.createElement('img');
                img.src = ref.dataUrl;
                img.alt = '参考图 ' + (i + 1);
                img.addEventListener('click', (e) => {
                    e.stopPropagation();
                    resultDataUrl = ref.dataUrl;
                    openPreview();
                });
                item.appendChild(img);
                const rm = document.createElement('button');
                rm.className = 'thumb-remove';
                rm.textContent = '×';
                rm.title = '移除';
                rm.addEventListener('click', (e) => {
                    e.stopPropagation();
                    refImages.splice(i, 1);
                    renderThumbnails();
                });
                item.appendChild(rm);
                els.thumbRow.insertBefore(item, els.thumbAdd);
            });
            // 保留 add 按钮事件
        }

        function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(blob);
            });
        }

        async function compressImageFile(file) {
            const bitmap = await createImageBitmap(file);
            const scale = Math.min(1, REF_IMAGE_MAX_SIDE / Math.max(bitmap.width, bitmap.height));
            const width = Math.max(1, Math.round(bitmap.width * scale));
            const height = Math.max(1, Math.round(bitmap.height * scale));

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(bitmap, 0, 0, width, height);
            bitmap.close?.();

            const blob = await new Promise((resolve, reject) => {
                canvas.toBlob((b) => b ? resolve(b) : reject(new Error('图片压缩失败')), 'image/jpeg', REF_IMAGE_QUALITY);
            });
            return {
                dataUrl: await blobToDataUrl(blob),
                originalSize: file.size,
                compressedSize: blob.size,
            };
        }

        async function addRefFiles(files) {
            const valid = Array.from(files).filter((f) => {
                if (f.size > 20 * 1024 * 1024) { alert(`${f.name} 超过 20MB，已跳过。请先压缩后再上传。`); return false; }
                return true;
            });
            for (const file of valid) {
                try {
                    const compressed = await compressImageFile(file);
                    refImages.push({ file, ...compressed });
                    renderThumbnails();
                } catch {
                    const dataUrl = await blobToDataUrl(file);
                    refImages.push({ file, dataUrl, originalSize: file.size, compressedSize: file.size });
                    renderThumbnails();
                }
            }
            els.imageFile.value = '';
        }

        async function addPastedImages(e) {
            const files = Array.from(e.clipboardData?.items || [])
                .filter((item) => item.kind === 'file' && item.type.startsWith('image/'))
                .map((item) => item.getAsFile())
                .filter(Boolean);
            if (!files.length) return false;
            e.preventDefault();
            await addRefFiles(files);
            els.statusBar.className = 'status-bar info';
            els.statusBar.textContent = `已从剪贴板添加 ${files.length} 张参考图片。`;
            return true;
        }

        function clearRefImages() {
            refImages = [];
            renderThumbnails();
        }

        async function editCurrentImage() {
            if (!resultDataUrl) return;
            let ref = { file: null, dataUrl: resultDataUrl, originalSize: resultBlob?.size || 0, compressedSize: resultBlob?.size || 0 };
            try {
                const sourceBlob = resultBlob || await fetch(resultDataUrl).then((resp) => resp.blob());
                const sourceFile = new File([sourceBlob], 'generated-reference.png', { type: sourceBlob.type || 'image/png' });
                const compressed = await compressImageFile(sourceFile);
                ref = { file: null, ...compressed };
            } catch { }
            refImages = [ref];
            renderThumbnails();
            els.prompt.value = '';
            els.prompt.placeholder = '描述你想如何修改这张图片，例如：保留人物姿势，把背景改成夜晚街景';
            els.prompt.focus();
            els.statusBar.className = 'status-bar info';
            els.statusBar.textContent = `已把当前生成图加入参考图片：${formatBytes(ref.originalSize)} → ${formatBytes(ref.compressedSize)}。请输入新的编辑要求。`;
        }

        function lockInputs() {
            els.prompt.disabled = true;
            els.model.disabled = true;
            els.thumbAdd.style.display = 'none';
            els.thumbRow.querySelectorAll('.thumb-remove').forEach((b) => { b.style.display = 'none'; });
        }

        function unlockInputs() {
            els.prompt.disabled = false;
            els.model.disabled = false;
            els.thumbAdd.style.display = '';
            els.thumbRow.querySelectorAll('.thumb-remove').forEach((b) => { b.style.display = ''; });
        }

        els.thumbAdd.addEventListener('click', () => els.imageFile.click());
        els.imageFile.addEventListener('change', () => {
            if (els.imageFile.files.length) addRefFiles(els.imageFile.files);
        });
        document.addEventListener('paste', addPastedImages);

        // ========== 顶部 Tab 切换 ==========
        els.topTabs.forEach((tab) => {
            tab.addEventListener('click', () => {
                els.topTabs.forEach((t) => t.classList.remove('active'));
                tab.classList.add('active');
                const page = tab.dataset.page;
                els.tabDraw.classList.toggle('active', page === 'draw');
                els.tabGallery.classList.toggle('active', page === 'gallery');
            });
        });

        // ========== Model 下拉状态 ==========
        let modelIds = [];
        let activeModelIdx = -1;
        let promptModelIds = [];
        let activePromptModelIdx = -1;
        const DEFAULT_PROMPT_MODELS = ['gemini-3.8-flash'];
        const GEMINI_IMAGE_MODELS = [
            'gemini-3-pro-image',
            'gemini-nano-banana-2.1',
        ];
        function resolveImageModelId(id) {
            const normalized = normalizeModelId(id).toLowerCase();
            return GEMINI_IMAGE_MODELS.find((model) => model.toLowerCase() === normalized) || GEMINI_IMAGE_MODELS[0];
        }

        function resolvePromptModelId(id) {
            const normalized = normalizeModelId(id).toLowerCase();
            return DEFAULT_PROMPT_MODELS.find((model) => model.toLowerCase() === normalized) || DEFAULT_PROMPT_MODELS[0];
        }

        function isImageModelId(id) {
            const normalized = normalizeModelId(id).toLowerCase();
            return GEMINI_IMAGE_MODELS.some((model) => model.toLowerCase() === normalized);
        }

        // ========== 设置 localStorage ==========
        const SAVED_KEY = 'img_gen_settings_gemini';
        const CONFIGS_KEY = 'img_gen_profiles';
        const ACTIVE_CONFIG_KEY = 'img_gen_active_profile';
        function getCurrentConfigValues() {
            return {
                baseUrl: els.baseUrl.value.trim(),
                apiKey: els.apiKey.value.trim(),
                model: els.model.value.trim(),
                promptModel: els.promptModel.value.trim(),
            };
        }

        function applySettings(settings) {
            els.baseUrl.value = settings?.baseUrl || 'https://generativelanguage.googleapis.com/v1beta';
            els.apiKey.value = settings?.apiKey || '';
            els.model.value = settings?.model ? resolveImageModelId(settings.model) : 'gemini-3-pro-image';
            els.promptModel.value = resolvePromptModelId(settings?.promptModel);
            modelIds = [];
            promptModelIds = [];
            renderModelPanel();
            renderPromptModelPanel();
        }

        function loadSettings() {
            let settings = null;
            try {
                settings = JSON.parse(localStorage.getItem(SAVED_KEY) || 'null');
                if (!settings?.baseUrl && !settings?.apiKey && !settings?.model) {
                    const savedConfigs = JSON.parse(localStorage.getItem(CONFIGS_KEY) || '[]');
                    const activeConfigId = localStorage.getItem(ACTIVE_CONFIG_KEY);
                    if (Array.isArray(savedConfigs) && savedConfigs.length) {
                        settings = savedConfigs.find((config) => config.id === activeConfigId) || savedConfigs[0];
                    }
                }
            } catch {
                settings = null;
            }
            applySettings(settings);
        }

        function saveSettings() {
            const values = getCurrentConfigValues();
            try {
                localStorage.setItem(SAVED_KEY, JSON.stringify(values));
            } catch { }
        }

        loadSettings();

        function normalizeBaseUrl(input) {
            let base = String(input || '').trim();
            if (!base) throw new Error('Base URL 不能为空');
            if (!/^https?:\/\//i.test(base)) throw new Error('Base URL 必须以 http:// 或 https:// 开头');
            base = base.replace(/\/+$/, '');
            // 如果用户填了 /v1 结尾，去掉，后面拼接时统一加
            if (base.endsWith('/v1')) base = base.slice(0, -3);
            return base;
        }

        function buildApiUrl(baseUrl, path) {
            const normalizedPath = path.startsWith('/') ? path : '/' + path;
            if (/\/(v\d+(beta)?\/openai|api\/v\d+)$/i.test(baseUrl)) {
                return baseUrl + normalizedPath;
            }
            return baseUrl + '/v1' + normalizedPath;
        }

        function normalizeModelId(id) {
            return String(id || '').trim().replace(/^models\//, '');
        }

        // ========== 图片展馆 (IndexedDB) ==========
        const DB_NAME = 'img-gen-gallery-gemini';
        const DB_VERSION = 1;
        let gallery = [];

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = () => {
                    if (!req.result.objectStoreNames.contains('records')) {
                        req.result.createObjectStore('records', { keyPath: 'id' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function loadGallery() {
            try {
                const db = await openDB();
                const tx = db.transaction('records', 'readonly');
                const all = await new Promise((resolve, reject) => {
                    const req = tx.objectStore('records').getAll();
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
                gallery = all.sort((a, b) => b.id - a.id);
                db.close();
            } catch { /* gallery 保持空 */ }
        }

        async function saveRecord(record) {
            try {
                const db = await openDB();
                const tx = db.transaction('records', 'readwrite');
                tx.objectStore('records').put(record);
                await new Promise((resolve, reject) => {
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
                db.close();
            } catch { }
        }

        async function deleteRecord(id) {
            try {
                const db = await openDB();
                const tx = db.transaction('records', 'readwrite');
                tx.objectStore('records').delete(id);
                await new Promise((resolve, reject) => {
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
                db.close();
            } catch { }
        }

        // ========== 轻量缩略图生成（降低展馆内存占用） ==========
        async function createThumbnailDataUrl(dataUrl, maxSide = 320, quality = 0.7) {
            if (!dataUrl || !dataUrl.startsWith('data:image/')) return dataUrl;
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                    const w = Math.max(1, Math.round(img.width * scale));
                    const h = Math.max(1, Math.round(img.height * scale));
                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = () => resolve(dataUrl);
                img.src = dataUrl;
            });
        }

        async function addToGallery(dataUrl, prompt, mode, refDataUrl, model) {
            const id = Date.now();
            let thumbDataUrl = null;
            try {
                thumbDataUrl = await createThumbnailDataUrl(dataUrl);
            } catch {
                thumbDataUrl = dataUrl;
            }
            const record = {
                id,
                dataUrl,
                thumbDataUrl: thumbDataUrl || dataUrl,
                prompt,
                mode,
                model: normalizeModelId(model) || '模型未记录',
                refDataUrl: refDataUrl || null,
                time: new Date().toLocaleString('zh-CN'),
            };
            gallery.unshift(record);
            renderGallery();
            saveRecord(record);
        }

        async function deleteFromGallery(id) {
            gallery = gallery.filter((r) => r.id !== id);
            renderGallery();
            deleteRecord(id);
        }

        function renderGallery() {
            els.galleryGrid.innerHTML = '';
            if (gallery.length === 0) {
                els.galleryEmpty.style.display = '';
                els.galleryCount.textContent = '';
                els.topGalleryBadge.textContent = '';
                return;
            }
            els.galleryEmpty.style.display = 'none';
            els.galleryCount.textContent = `(${gallery.length} 张)`;
            els.topGalleryBadge.textContent = `(${gallery.length})`;

            for (const r of gallery) {
                const card = document.createElement('div');
                card.className = 'gallery-item';

                const thumbWrap = document.createElement('div');
                thumbWrap.className = 'thumb-wrap';
                const img = document.createElement('img');
                img.src = r.thumbDataUrl || r.dataUrl;
                img.alt = '生成的图片';
                img.loading = 'lazy';
                img.title = '点击查看大图';
                img.addEventListener('click', () => {
                    resultDataUrl = r.dataUrl;
                    openPreview();
                });
                thumbWrap.appendChild(img);

                const badge = document.createElement('span');
                badge.className = 'mode-badge';
                badge.textContent = r.mode === 1 ? '文生图' : '图生图';
                thumbWrap.appendChild(badge);

                card.appendChild(thumbWrap);

                // 参考图行（图生图）
                if (r.refDataUrl) {
                    const refRow = document.createElement('div');
                    refRow.className = 'ref-row';
                    const refThumb = document.createElement('div');
                    refThumb.className = 'ref-thumb';
                    const refImg = document.createElement('img');
                    refImg.src = r.refDataUrl;
                    refImg.alt = '参考图';
                    refThumb.addEventListener('click', (e) => {
                        e.stopPropagation();
                        resultDataUrl = r.refDataUrl;
                        openPreview();
                    });
                    refThumb.appendChild(refImg);
                    refRow.appendChild(refThumb);
                    card.appendChild(refRow);
                }

                // 信息区域
                const info = document.createElement('div');
                info.className = 'info';

                const promptRow = document.createElement('div');
                promptRow.className = 'prompt-row';
                const promptEl = document.createElement('div');
                promptEl.className = 'prompt-text';
                promptEl.textContent = r.prompt;
                promptEl.title = r.prompt;
                promptRow.appendChild(promptEl);

                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-prompt';
                copyBtn.innerHTML = '&#x1f4cb;';
                copyBtn.title = '复制提示词';
                copyBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    navigator.clipboard.writeText(r.prompt).then(() => {
                        copyBtn.innerHTML = '&#x2705;';
                        setTimeout(() => { copyBtn.innerHTML = '&#x1f4cb;'; }, 1200);
                    });
                });
                promptRow.appendChild(copyBtn);
                info.appendChild(promptRow);

                const meta = document.createElement('div');
                meta.className = 'meta';
                const recordMeta = document.createElement('span');
                recordMeta.className = 'record-meta';
                const modelName = r.model || '模型未记录';
                recordMeta.textContent = r.time;
                recordMeta.title = `模型：${modelName}\n时间：${r.time}`;
                meta.appendChild(recordMeta);
                const delBtn = document.createElement('button');
                delBtn.className = 'del-btn';
                delBtn.innerHTML = '&#x1f5d1;';
                delBtn.title = '删除';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteFromGallery(r.id);
                });
                meta.appendChild(delBtn);
                info.appendChild(meta);

                card.appendChild(info);
                els.galleryGrid.appendChild(card);
            }
        }

        // 页面加载时从 IndexedDB 恢复
        loadGallery().then(() => renderGallery());

        // ========== 密码显隐切换 ==========
        els.pwdToggle.addEventListener('click', () => {
            const isPwd = els.apiKey.type === 'password';
            els.apiKey.type = isPwd ? 'text' : 'password';
            els.pwdToggle.textContent = isPwd ? '\u{1f441}\u{200d}\u{1f5e8}' : '\u{1f441}';
        });

        // ========== 事件日志 ==========
        let eventCount = 0;
        function appendEvent(type, msg) {
            eventCount++;
            els.statEvents.textContent = `📡 事件: ${eventCount}`;
            els.eventLog.classList.add('active');
            const now = new Date();
            const ts = now.toTimeString().slice(0, 8);
            const tagClass = type === 'event' ? 'event-tag' : type === 'data' ? 'data-tag' : type === 'text' ? 'text-tag' : 'done-tag';
            const tagLabel = type === 'event' ? 'EVENT' : type === 'data' ? 'DATA' : type === 'text' ? 'TEXT' : 'DONE';

            const line = document.createElement('div');
            line.className = 'line';
            line.innerHTML = `<span class="ts">${ts}</span><span class="tag ${tagClass}">${tagLabel}</span><span class="msg">${escapeHtml(msg)}</span>`;
            els.eventLog.appendChild(line);
            els.eventLog.scrollTop = els.eventLog.scrollHeight;
        }
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // ========== 计时器 ==========
        let startTime = 0;
        let timerInterval = null;
        function startTimer() {
            startTime = Date.now();
            els.statElapsed.textContent = '⏱ 0s';
            timerInterval = setInterval(() => {
                const s = Math.floor((Date.now() - startTime) / 1000);
                els.statElapsed.textContent = `⏱ ${s}s`;
            }, 500);
        }
        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            const s = ((Date.now() - startTime) / 1000).toFixed(1);
            els.statElapsed.textContent = `⏱ ${s}s`;
        }

        // ========== 递归搜索 base64 ==========
        // ========== Gemini payload and response parsing ==========
        function dataUrlToGeminiPart(dataUrl) {
            const [meta, data] = String(dataUrl).split(',');
            const mimeType = (meta.match(/^data:([^;]+)/) || [])[1] || 'image/jpeg';
            return { inlineData: { mimeType, data } };
        }

        function extractBase64AsDataUrl(dataObj) {
            if (dataObj == null) return null;
            if (Array.isArray(dataObj)) {
                for (const item of dataObj) {
                    const found = extractBase64AsDataUrl(item);
                    if (found) return found;
                }
            } else if (typeof dataObj === 'object') {
                if (typeof dataObj.b64_json === 'string') return 'data:image/png;base64,' + dataObj.b64_json;
                if (typeof dataObj.base64 === 'string') return 'data:image/png;base64,' + dataObj.base64;
                if (typeof dataObj.url === 'string') return dataObj.url;
                const inlineData = dataObj.inlineData || dataObj.inline_data;
                if (inlineData?.data) {
                    const mimeType = inlineData.mimeType || inlineData.mime_type || 'image/png';
                    return `data:${mimeType};base64,${inlineData.data}`;
                }
                for (const value of Object.values(dataObj)) {
                    const found = extractBase64AsDataUrl(value);
                    if (found) return found;
                }
            }
            return null;
        }

        async function buildPayload() {
            const prompt = els.prompt.value.trim();
            const parts = refImages.map((ref) => dataUrlToGeminiPart(ref.dataUrl));
            parts.push({ text: refImages.length > 0 ? `请根据这些参考图片进行编辑或重绘：${prompt}` : prompt });
            return {
                contents: [{ role: 'user', parts }],
                generationConfig: { responseModalities: ['TEXT', 'IMAGE'] },
            };
        }

        // ========== 核心：发送请求 ==========
        function buildProviderRequest(baseUrl, model, apiKey) {
            const modelPath = model.startsWith('models/') ? model : 'models/' + model;
            return {
                url: `${baseUrl}/${modelPath}:generateContent`,
                headers: { 'x-goog-api-key': apiKey, 'Content-Type': 'application/json' },
            };
        }

        function showGeneratedImage(dataUrl, prompt, startTime) {
            resultDataUrl = dataUrl;
            resultBlob = null;
            let sizeStr = '远程图片';

            if (dataUrl.startsWith('data:')) {
                const [meta, b64] = dataUrl.split(',');
                const mimeType = (meta.match(/^data:([^;]+)/) || [])[1] || 'image/png';
                const byteChars = atob(b64);
                const bytes = new Uint8Array(byteChars.length);
                for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
                resultBlob = new Blob([bytes], { type: mimeType });
                const sizeKB = (bytes.length / 1024).toFixed(1);
                sizeStr = sizeKB > 1024 ? (sizeKB / 1024).toFixed(1) + ' MB' : sizeKB + ' KB';
            }

            stopTimer();
            els.loadingMini.classList.remove('active');
            els.resultImg.src = dataUrl;
            els.resultArea.classList.add('active');
            els.resultStats.textContent = `尺寸 ${els.resultImg.naturalWidth || '?'} x ${els.resultImg.naturalHeight || '?'}  ·  大小 ${sizeStr}  ·  用时 ${((Date.now() - startTime) / 1000).toFixed(1)}s`;
            els.resultImg.onload = () => {
                els.resultStats.textContent = `尺寸 ${els.resultImg.naturalWidth} x ${els.resultImg.naturalHeight}  ·  大小 ${sizeStr}  ·  用时 ${((Date.now() - startTime) / 1000).toFixed(1)}s`;
            };
            appendEvent('done', `图片已生成！大小: ${sizeStr}`);
            unlockInputs();
            els.genBtn.disabled = false;
            els.genBtn.textContent = '重新生成';
            const mode = refImages.length > 0 ? 2 : 1;
            const refUrl = refImages.length > 0 ? refImages[0].dataUrl : null;
            addToGallery(dataUrl, prompt, mode, refUrl, els.model.value);
            clearRefImages();
        }

        async function generate() {
            const apiKey = els.apiKey.value.trim();
            if (!apiKey) { alert('请填写 API Key'); return; }

            let baseUrl;
            try { baseUrl = normalizeBaseUrl(els.baseUrl.value); }
            catch (e) { alert(e.message); return; }

            const model = normalizeModelId(els.model.value);
            if (!isImageModelId(model)) {
                alert('请从列表中选择 Gemini 生图模型');
                return;
            }
            els.model.value = model;

            const prompt = els.prompt.value.trim();
            if (!prompt) { alert('请填写提示词'); return; }

            saveSettings();

            let payload;
            try { payload = await buildPayload(); }
            catch (e) { alert(e.message); return; }

            resetUI();
            lockInputs();
            els.genBtn.disabled = true;
            els.genBtn.textContent = '生成中…';
            els.loadingMini.classList.add('active');
            els.statEvents.textContent = '事件: 0';
            els.statTextLen.textContent = '文本: 0 字';
            startTimer();

            const requestInfo = buildProviderRequest(baseUrl, model, apiKey);
            appendEvent('event', `开始请求 POST ${new URL(requestInfo.url).pathname}`);

            currentAbortController = new AbortController();
            els.cancelBtn.style.display = 'inline-block';
            requestTimeoutId = setTimeout(() => {
                if (currentAbortController) {
                    currentAbortController.abort('生成超时 (120秒)');
                }
            }, 120000);

            try {
                const response = await fetch(requestInfo.url, {
                    method: 'POST',
                    headers: requestInfo.headers,
                    body: JSON.stringify(payload),
                    signal: currentAbortController.signal
                });
                if (!response.ok) {
                    let errText = '';
                    try { errText = await response.text(); } catch { }
                    stopTimer();
                    els.loadingMini.classList.remove('active');
                    unlockInputs();
                    els.genBtn.disabled = false;
                    els.genBtn.textContent = '重新生成';
                    appendEvent('event', `HTTP请求失败 ${response.status} — ${errText}`);
                    els.statusBar.className = 'status-bar err';
                    els.statusBar.textContent = `请求失败！HTTP ${response.status}${errText ? '\n' + errText.slice(0, 500) : ''}`;
                    return;
                }

                const data = await response.json();
                appendEvent('data', '收到 JSON 响应');
                const dataUrl = extractBase64AsDataUrl(data);
                if (dataUrl) {
                    els.cancelBtn.style.display = 'none';
                    if (requestTimeoutId) clearTimeout(requestTimeoutId);
                    showGeneratedImage(dataUrl, prompt, startTime);
                    return;
                }

                els.cancelBtn.style.display = 'none';
                if (requestTimeoutId) clearTimeout(requestTimeoutId);
                stopTimer();
                els.loadingMini.classList.remove('active');
                unlockInputs();
                els.genBtn.disabled = false;
                els.genBtn.textContent = '重新生成';
                els.statusBar.className = 'status-bar err';
                els.statusBar.textContent = '响应成功，但未找到图片数据。请检查模型是否支持图片输出。';
                appendEvent('done', '响应中未找到图片数据');
            } catch (err) {
                els.cancelBtn.style.display = 'none';
                if (requestTimeoutId) clearTimeout(requestTimeoutId);
                stopTimer();
                els.loadingMini.classList.remove('active');
                unlockInputs();
                els.genBtn.disabled = false;
                els.genBtn.textContent = '重新生成';

                if (err.name === 'AbortError') {
                    appendEvent('event', '请求已中断: ' + (err.message || '用户取消或超时'));
                    els.statusBar.className = 'status-bar info';
                    els.statusBar.textContent = '已取消当前图片生成请求。';
                    return;
                }

                appendEvent('event', `异常: ${err.message || err}`);
                els.statusBar.className = 'status-bar err';
                els.statusBar.textContent = '发生异常：' + (err.message || err) + '\n提示：浏览器直连第三方 API 可能会被 CORS 拦截，必要时请使用后端代理。';
            }
        }



        function downloadFilename() {
            const d = new Date();

            return `img-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.png`;
        }

        // ========== 图片预览（点击放大 / ESC 关闭 / 滚轮缩放 / 拖拽平移） ==========
        let previewScale = 1;
        let panX = 0, panY = 0;
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0;
        let panStartX = 0, panStartY = 0;

        function updatePreviewTransform() {
            els.previewImg.style.transform = `translate(${panX}px, ${panY}px) scale(${previewScale})`;
        }

        function openPreview() {
            if (!resultDataUrl) return;
            previewScale = 1;
            panX = 0;
            panY = 0;

        els.resultImg.addEventListener('click', openPreview);

        });

            }
        });

        // 滚轮缩放（以鼠标位置为锚点）
        els.previewOverlay.addEventListener('wheel', (e) => {
            if (!els.previewOverlay.classList.contains('open')) return;
            e.preventDefault();

            const rect = els.previewImg.getBoundingClientRect();
            const fx = (e.clientX - rect.left) / rect.width;
            const fy = (e.clientY - rect.top) / rect.height;

            const oldScale = previewScale;
            previewScale = Math.max(0.2, Math.min(5, previewScale + (e.deltaY > 0 ? -0.1 : 0.1)));

            const ratio = previewScale / oldScale;
            const newLeft = e.clientX - fx * rect.width * ratio;
            const newTop = e.clientY - fy * rect.height * ratio;

            panX += newLeft - rect.left;
            panY += newTop - rect.top;
            updatePreviewTransform();
        });

        // 拖拽平移
        els.previewImg.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            isDragging = true;
            els.previewImg.classList.add('dragging');
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            panStartX = panX;
            panStartY = panY;
            e.preventDefault();
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = panStartX + (e.clientX - dragStartX);
            panY = panStartY + (e.clientY - dragStartY);
            updatePreviewTransform();
        });
        window.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;
            els.previewImg.classList.remove('dragging');
        });

        // 本地规则扩写兜底引擎
        function localEnhancePrompt(raw) {
            const qualityKeywords = ['大师杰作', '极致细节', '8K超高清', '景深光影', '精美构图', '逼真质感', '层次丰富'];
            const missing = qualityKeywords.filter((k) => !raw.includes(k)).slice(0, 4);
            return missing.length ? raw + '，' + missing.join('，') : raw;
        }

        // AI 提示词优化调用
        async function optimizePrompt() {
            const raw = els.prompt.value.trim();
            if (!raw) {
                alert('请先输入简单的画面描述（如：一只戴墨镜的柯基犬），再点击优化。');
                els.prompt.focus();
                return;
            }

            const apiKey = els.apiKey.value.trim();
            let baseUrl = '';
            try {
                baseUrl = normalizeBaseUrl(els.baseUrl.value);
            } catch {
                baseUrl = 'https://generativelanguage.googleapis.com/v1beta';
            }

            lastOriginalPrompt = els.prompt.value;
            els.optimizeBtn.disabled = true;
            els.optimizeBtn.classList.add('loading');
            els.optimizeBtn.textContent = '优化中…';
            els.statusBar.className = 'status-bar info';
            els.statusBar.textContent = '正在通过 AI 润色扩写提示词，请稍候…';

            const optimizePromptText = '你是一位顶级 AI 绘画提示词专家。请根据用户的简要描述，扩写润色为富有画面细节、光影氛围、质感层次与高美感的生图提示词。' +
                '\n\n【严格要求】' +
                '\n1. 直接输出优化后的中文生图提示词正文，不要有任何前言、解释、分析、引号或问候语。' +
                '\n2. 保持用户原有核心主体不变，合理拓展构图、光照、色彩、背景环境与画面质感。' +
                '\n\n用户描述：' + raw;

            let optimizedResult = '';

            if (apiKey) {
                // 仅使用固定的 Gemini 提示词模型
                const customPromptModel = resolvePromptModelId(els.promptModel.value);
                const candidateModels = [customPromptModel];
                for (const m of candidateModels) {
                    try {
                        const modelPath = m.startsWith('models/') ? m : 'models/' + m;
                        const url = baseUrl + '/' + modelPath + ':generateContent';
                        const resp = await fetch(url, {
                            method: 'POST',
                            headers: { 'x-goog-api-key': apiKey, 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ role: 'user', parts: [{ text: optimizePromptText }] }],
                                generationConfig: { temperature: 0.7 }
                            })
                        });
                        if (resp.ok) {
                            const data = await resp.json();
                            const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                            if (text && text.trim()) {
                                optimizedResult = text.trim();
                                break;
                            }
                        }
                    } catch { }

            if (!optimizedResult) {
                // 降级为本地高质量生图增强
                optimizedResult = localEnhancePrompt(raw);
                els.statusBar.textContent = '已使用生图美学增强引擎完成优化！可点击【撤回】还原。';

            }

            else if (e.key === 'Escape') { closePromptModelPanel(); }
        });

        // 点击外部或切换焦点到外部时关闭模型下拉面板（避免拖动下拉滚动条时触发 blur 导致面板闪退）
        document.addEventListener('mousedown', (e) => {
            if (!els.model.parentElement.contains(e.target)) closeModelPanel();
            if (!els.promptModel.parentElement.contains(e.target)) closePromptModelPanel();
        });
        document.addEventListener('focusin', (e) => {
            if (!els.model.parentElement.contains(e.target)) closeModelPanel();
            if (!els.promptModel.parentElement.contains(e.target)) closePromptModelPanel();
        });
        // ========== End Model 下拉 ==========
    </script>
</body>

</html>
