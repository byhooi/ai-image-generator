<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini 图片生成工具</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0b1020;
            color: #e5e7eb;
        }

        .wrap {
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .card {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 16px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
        }

        @media (max-width: 860px) {
            .card {
                grid-template-columns: 1fr;
            }
        }

        /* ====== 顶部 Tab ====== */
        .top-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 16px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #374151;
        }

        .top-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            background: #0f172a;
            color: #94a3b8;
            transition: .15s;
            user-select: none;
            text-decoration: none;
        }

        .top-tab.active {
            background: #2563eb;
            color: #fff;
        }

        .top-tab:not(:last-child) {
            border-right: 1px solid #374151;
        }

        .tab-page {
            display: none;
        }

        .tab-page.active {
            display: block;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 22px;
            grid-column: 1 / -1;
        }

        .sub {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 0;
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 4px;
            display: block;
        }

        input,
        textarea,
        select {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #374151;
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
        }

        select {
            appearance: none;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            border: 0;
            background: #2563eb;
            color: #fff;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        button.secondary {
            background: #374151;
        }

        /* ====== 左栏 ====== */
        .main-panel {
            min-width: 0;
        }

        .setting-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .setting-row3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        @media (max-width: 700px) {
            .setting-row3 {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 500px) {

            .setting-row,
            .setting-row3 {
                grid-template-columns: 1fr;
            }
        }

        /* model 下拉 */
        .combo {
            position: relative;
        }

        .combo-panel {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            z-index: 50;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            max-height: 220px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
        }

        .combo-panel.open {
            display: block;
        }

        .combo-item {
            padding: 8px 12px;
            font-size: 12px;
            cursor: pointer;
            color: #e2e8f0;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .combo-item:hover,
        .combo-item.active {
            background: #1e293b;
        }

        .combo-empty {
            padding: 10px 12px;
            font-size: 11px;
            color: #64748b;
        }

        .pwd-wrap {
            position: relative;
        }

        .pwd-wrap input {
            padding-right: 40px;
        }

        .pwd-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: 0;
            color: #6b7280;
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            line-height: 1;
        }

        .pwd-toggle:hover {
            color: #e5e7eb;
        }

        /* ====== 多图选择器 ====== */
        .img-picker {
            margin-bottom: 12px;
        }

        .thumb-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .thumb-item {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #374151;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            background: #0a0f18;
        }

        .thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .thumb-item .thumb-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: rgba(0, 0, 0, .75);
            color: #e5e7eb;
            border: 0;
            cursor: pointer;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            padding: 0;
            display: none;
        }

        .thumb-item:hover .thumb-remove {
            display: block;
        }

        .thumb-item .thumb-remove:hover {
            background: rgba(185, 28, 28, .9);
        }

        .thumb-add {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            border: 2px dashed #374151;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 28px;
            background: #0f172a;
            transition: .15s;
        }

        .thumb-add:hover {
            border-color: #2563eb;
            color: #3b82f6;
            background: #111d32;
        }

        /* ====== 结果区域 ====== */
        .result-area {
            display: none;
            margin-top: 14px;
            text-align: center;
            animation: fadeInUp .4s ease;
        }

        .result-area.active {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-area img {
            max-width: 100%;
            max-height: 500px;
            border-radius: 10px;
            border: 1px solid #374151;
            cursor: zoom-in;
            animation: fadeInUp .5s ease;
            transition: transform .15s;
        }

        .result-area img:hover {
            transform: scale(1.02);
        }

        .result-info {
            margin-top: 6px;
            font-size: 12px;
            color: #6b7280;
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .status-bar {
            margin-top: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            background: #0f172a;
            border: 1px solid #1f2937;
            display: none;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .status-bar.info {
            display: block;
            color: #93c5fd;
            border-color: #1e3a5f;
            background: #0c1929;
        }

        .status-bar.done {
            display: block;
            color: #bbf7d0;
            border-color: #166534;
            background: #052016;
        }

        .status-bar.err {
            display: block;
            color: #fecdd3;
            border-color: #9f1239;
            background: #20060d;
        }

        /* ====== 右栏：实时面板 ====== */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 520px;
            border-left: 1px solid #1f2937;
            padding-left: 16px;
        }

        @media (max-width: 860px) {
            .side-panel {
                border-left: 0;
                padding-left: 0;
                border-top: 1px solid #1f2937;
                padding-top: 14px;
                min-height: 0;
            }
        }

        .side-panel-header {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: .08em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .side-panel-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #1f2937;
        }

        /* loading mini */
        .loading-mini {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            background: #0c1929;
            border: 1px solid #1e3a5f;
        }

        .loading-mini.active {
            display: flex;
        }

        .loading-mini .spinner-sm {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            border: 2px solid #1e3a5f;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading-mini .stats-row {
            font-size: 11px;
            color: #64748b;
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        /* 事件日志 */
        .event-log {
            display: none;
            flex: 1;
            border: 1px solid #1a2236;
            border-radius: 8px;
            background: #0a0f18;
            overflow-y: auto;
            font-size: 12px;
            min-height: 200px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .event-log.active {
            display: block;
        }

        .event-log .line {
            padding: 2px 10px;
            border-bottom: 1px solid #0c1320;
            display: flex;
            gap: 6px;
            align-items: flex-start;
        }

        .event-log .line:last-child {
            border-bottom: 0;
        }

        .event-log .ts {
            color: #4b5563;
            flex-shrink: 0;
            min-width: 54px;
            font-size: 11px;
        }

        .event-log .tag {
            flex-shrink: 0;
            min-width: 44px;
            font-weight: 600;
            font-size: 11px;
        }

        .event-log .tag.event-tag {
            color: #f59e0b;
        }

        .event-log .tag.data-tag {
            color: #3b82f6;
        }

        .event-log .tag.text-tag {
            color: #6b7280;
        }

        .event-log .tag.done-tag {
            color: #22c55e;
        }

        .event-log .msg {
            color: #9ca3af;
            word-break: break-all;
            flex: 1;
        }

        /* 文本流 */
        .text-stream {
            display: none;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 12px;
            background: #0a0f18;
            border: 1px solid #1a2236;
            color: #9ca3af;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            max-height: 180px;
        }

        .text-stream.active {
            display: block;
        }

        /* ====== 全屏预览遮罩 ====== */
        .preview-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, .92);
            cursor: zoom-out;
            align-items: center;
            justify-content: center;
        }

        .preview-overlay.open {
            display: flex;
        }

        .preview-overlay img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 6px;
            user-select: none;
            transition: transform .1s ease;
            cursor: grab;
        }

        .preview-overlay img.dragging {
            cursor: grabbing;
            transition: none;
        }

        .preview-close {
            position: absolute;
            top: 16px;
            right: 24px;
            font-size: 32px;
            color: #9ca3af;
            cursor: pointer;
            line-height: 1;
            z-index: 1;
            user-select: none;
        }

        .preview-close:hover {
            color: #fff;
        }

        .preview-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #6b7280;
            pointer-events: none;
        }

        /* ====== 图片展馆 ====== */
        .gallery-card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 20px;
        }

        .gallery-card h2 {
            margin: 0 0 4px;
            font-size: 16px;
            color: #e5e7eb;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
            margin-top: 12px;
        }

        .gallery-item {
            background: #0f172a;
            border: 1px solid #1f2937;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            animation: fadeInUp .3s ease;
        }

        .gallery-item .thumb-wrap {
            position: relative;
            overflow: hidden;
            background: #0a0f18;
            cursor: pointer;
        }

        .gallery-item .thumb-wrap img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform .2s;
            aspect-ratio: 1;
            object-fit: cover;
        }

        .gallery-item .thumb-wrap:hover img {
            transform: scale(1.05);
        }

        .gallery-item .thumb-wrap .mode-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(0, 0, 0, .7);
            color: #e5e7eb;
        }

        .gallery-item .ref-row {
            display: flex;
            gap: 4px;
            padding: 4px 6px 0;
            flex-wrap: wrap;
        }

        .gallery-item .ref-thumb {
            width: 48px;
            height: 48px;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #374151;
            cursor: pointer;
            flex-shrink: 0;
            background: #0a0f18;
        }

        .gallery-item .ref-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item .ref-thumb:hover {
            border-color: #3b82f6;
        }

        .gallery-item .info {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .gallery-item .info .prompt-text {
            font-size: 12px;
            color: #9ca3af;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
            flex: 1;
        }

        .gallery-item .info .prompt-row {
            display: flex;
            gap: 6px;
            align-items: flex-start;
        }

        .gallery-item .info .copy-prompt {
            background: none;
            border: 0;
            color: #4b5563;
            cursor: pointer;
            font-size: 13px;
            padding: 1px 4px;
            line-height: 1;
            flex-shrink: 0;
        }

        .gallery-item .info .copy-prompt:hover {
            color: #e5e7eb;
        }

        .gallery-item .info .meta {
            font-size: 11px;
            color: #4b5563;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .gallery-item .info .del-btn {
            background: none;
            border: 0;
            color: #6b7280;
            cursor: pointer;
            font-size: 16px;
            padding: 2px 6px;
            line-height: 1;
        }

        .gallery-item .info .del-btn:hover {
            color: #ef4444;
        }

        .gallery-empty {
            text-align: center;
            color: #4b5563;
            font-size: 13px;
            padding: 24px 0;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <!-- ============ 顶部 Tab ============ -->
        <div class="top-tabs">
            <a class="top-tab" href="index.html">OpenAI</a>
            <a class="top-tab active" href="gemini.html">Gemini</a>
            <a class="top-tab" href="doubao.html">豆包</a>
            <div class="top-tab" data-page="gallery">图片展馆 <span id="topGalleryBadge"
                    style="font-size:12px;opacity:.7;"></span></div>
        </div>

        <!-- ============ 画图页 ============ -->
        <div id="tabDraw" class="tab-page active">
            <div class="card">
                <h1>Gemini 图片生成</h1>
                <div class="sub">Gemini 原生 generateContent：支持文生图 & 图生图，浏览器直连可能受 CORS 限制</div>

                <!-- ============ 左栏：输入 + 结果 ============ -->
                <div class="main-panel">

                    <div class="setting-row3">
                        <div>
                            <label for="baseUrl">Base URL</label>
                            <input id="baseUrl" placeholder="https://generativelanguage.googleapis.com/v1beta" autocomplete="off" />
                        </div>
                        <div>
                            <label for="apiKey">API Key</label>
                            <div class="pwd-wrap">
                                <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" />
                                <button id="pwdToggle" class="pwd-toggle" title="显示/隐藏">&#x1f441;</button>
                            </div>
                        </div>
                        <div>
                            <label for="model">Model</label>
                            <div class="combo">
                                <input id="model" placeholder="聚焦自动拉取模型列表" autocomplete="off" />
                                <div id="modelPanel" class="combo-panel"></div>
                            </div>
                        </div>
                    </div>

                    <!-- 参考图片选择器（多图） -->
                    <div class="img-picker">
                        <label>参考图片（可选，支持选择或直接粘贴图片，上传后自动切换为图生图模式）</label>
                        <div class="thumb-row" id="thumbRow">
                            <input id="imageFile" type="file" accept="image/*" multiple style="display:none;" />
                            <div id="thumbAdd" class="thumb-add" title="添加参考图片">+</div>
                        </div>
                    </div>

                    <div>
                        <label for="prompt">图片描述（提示词）</label>
                        <textarea id="prompt" placeholder="例如：一只在雨中奔跑的柴犬，皮克斯动画风格"></textarea>
                    </div>

                    <button id="genBtn" style="margin-top:10px; width:100%;">生成图片</button>

                    <div id="resultArea" class="result-area">
                        <img id="resultImg" alt="生成的图片" />
                        <div class="result-info"><span id="resultStats"></span></div>
                        <div class="actions">
                            <button id="editBtn" class="secondary">编辑这张图</button>
                            <button id="downloadBtn">下载图片</button>
                            <button id="copyBtn" class="secondary">复制到剪贴板</button>
                        </div>
                    </div>

                    <div id="statusBar" class="status-bar"></div>
                </div>

                <!-- ============ 右栏：实时事件流 ============ -->
                <div class="side-panel">
                    <div class="side-panel-header">实时事件流</div>

                    <div id="loadingMini" class="loading-mini">
                        <div class="spinner-sm"></div>
                        <div class="stats-row">
                            <span id="statEvents">📡 事件: 0</span>
                            <span id="statTextLen">📝 文本: 0 字</span>
                            <span id="statElapsed">⏱ 0s</span>
                        </div>
                    </div>

                    <div id="eventLog" class="event-log"></div>
                    <div id="textStream" class="text-stream"></div>
                </div>
            </div>
        </div>

        <!-- ============ 全屏预览遮罩（全局，跨 Tab） ============ -->
        <div id="previewOverlay" class="preview-overlay">
            <span class="preview-close">&times;</span>
            <img id="previewImg" alt="预览" draggable="false" />
            <span class="preview-hint">滚轮缩放 · ESC 关闭</span>
        </div>

        <!-- ============ 图片展馆页 ============ -->
        <div id="tabGallery" class="tab-page">
            <div class="gallery-card">
                <h2>生成记录展馆 <span id="galleryCount" style="font-size:13px;color:#64748b;font-weight:400;"></span></h2>
                <div id="galleryGrid" class="gallery-grid"></div>
                <div id="galleryEmpty" class="gallery-empty" style="display:none;">暂无生成记录，快去生成第一张图片吧</div>
            </div>
        </div>

    </div>

    <script>
        // ========== DOM 引用 ==========
        const $ = (s) => document.querySelector(s);
        const $$ = (s) => document.querySelectorAll(s);
        const els = {
            topTabs: $$('.top-tab'),
            tabDraw: $('#tabDraw'),
            tabGallery: $('#tabGallery'),
            topGalleryBadge: $('#topGalleryBadge'),
            apiKey: $('#apiKey'),
            pwdToggle: $('#pwdToggle'),
            baseUrl: $('#baseUrl'),
            model: $('#model'),
            modelPanel: $('#modelPanel'),
            imageFile: $('#imageFile'),
            thumbRow: $('#thumbRow'),
            thumbAdd: $('#thumbAdd'),
            prompt: $('#prompt'),
            genBtn: $('#genBtn'),
            loadingMini: $('#loadingMini'),
            statEvents: $('#statEvents'),
            statTextLen: $('#statTextLen'),
            statElapsed: $('#statElapsed'),
            eventLog: $('#eventLog'),
            textStream: $('#textStream'),
            statusBar: $('#statusBar'),
            resultArea: $('#resultArea'),
            resultImg: $('#resultImg'),
            resultStats: $('#resultStats'),
            editBtn: $('#editBtn'),
            downloadBtn: $('#downloadBtn'),
            copyBtn: $('#copyBtn'),
            previewOverlay: $('#previewOverlay'),
            previewImg: $('#previewImg'),
            galleryGrid: $('#galleryGrid'),
            galleryCount: $('#galleryCount'),
            galleryEmpty: $('#galleryEmpty'),
        };

        let resultDataUrl = null;
        let resultBlob = null;

        // ========== 多图选择器 ==========
        let refImages = []; // { file, dataUrl, originalSize, compressedSize }
        const REF_IMAGE_MAX_SIDE = 1024;
        const REF_IMAGE_QUALITY = 0.78;

        function formatBytes(bytes) {
            if (!bytes) return '0 B';
            const units = ['B', 'KB', 'MB'];
            let size = bytes;
            let idx = 0;
            while (size >= 1024 && idx < units.length - 1) {
                size /= 1024;
                idx++;
            }
            return `${size.toFixed(idx === 0 ? 0 : 1)} ${units[idx]}`;
        }

        function blobToDataUrl(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(blob);
            });
        }

        async function compressImageFile(file) {
            const bitmap = await createImageBitmap(file);
            const scale = Math.min(1, REF_IMAGE_MAX_SIDE / Math.max(bitmap.width, bitmap.height));
            const width = Math.max(1, Math.round(bitmap.width * scale));
            const height = Math.max(1, Math.round(bitmap.height * scale));

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(bitmap, 0, 0, width, height);
            bitmap.close?.();

            const blob = await new Promise((resolve, reject) => {
                canvas.toBlob((b) => b ? resolve(b) : reject(new Error('图片压缩失败')), 'image/jpeg', REF_IMAGE_QUALITY);
            });
            return {
                dataUrl: await blobToDataUrl(blob),
                originalSize: file.size,
                compressedSize: blob.size,
            };
        }

        async function addRefFiles(files) {
            const valid = Array.from(files).filter((f) => {
                if (f.size > 20 * 1024 * 1024) { alert(`${f.name} 超过 20MB，已跳过。请先压缩后再上传。`); return false; }
                return true;
            });
            for (const file of valid) {
                try {
                    const compressed = await compressImageFile(file);
                    refImages.push({ file, ...compressed });
                    renderThumbnails();
                } catch {
                    const dataUrl = await blobToDataUrl(file);
                    refImages.push({ file, dataUrl, originalSize: file.size, compressedSize: file.size });
                    renderThumbnails();
                }
            }
            els.imageFile.value = '';
        }

        function normalizeBaseUrl(input) {
            let base = String(input || '').trim();
            if (!base) throw new Error('Base URL 不能为空');
            if (!/^https?:\/\//i.test(base)) throw new Error('Base URL 必须以 http:// 或 https:// 开头');
            base = base.replace(/\/+$/, '');
            // 如果用户填了 /v1 结尾，去掉，后面拼接时统一加
            if (base.endsWith('/v1')) base = base.slice(0, -3);
            return base;
        }

        function buildApiUrl(baseUrl, path) {
            const normalizedPath = path.startsWith('/') ? path : '/' + path;
            if (/\/(v\d+(beta)?\/openai|api\/v\d+)$/i.test(baseUrl)) {
                return baseUrl + normalizedPath;
            }
            return baseUrl + '/v1' + normalizedPath;
        }

        // ========== 图片展馆 (IndexedDB) ==========
        const DB_NAME = 'img-gen-gallery-gemini';
        const DB_VERSION = 1;

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = () => {
                    if (!req.result.objectStoreNames.contains('records')) {
                        req.result.createObjectStore('records', { keyPath: 'id' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function loadGallery() {
            try {
                const db = await openDB();
                const tx = db.transaction('records', 'readonly');
                const all = await new Promise((resolve, reject) => {
                    const req = tx.objectStore('records').getAll();
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
                gallery = all.sort((a, b) => b.id - a.id);
                db.close();
            } catch { /* gallery 保持空 */ }
        }

        async function saveRecord(record) {
            try {
                const db = await openDB();
                const tx = db.transaction('records', 'readwrite');
                tx.objectStore('records').put(record);
                await new Promise((resolve, reject) => {
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
                db.close();
            } catch { }
        }

        async function deleteRecord(id) {
            try {
                const db = await openDB();
                const tx = db.transaction('records', 'readwrite');
                tx.objectStore('records').delete(id);
                await new Promise((resolve, reject) => {
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                });
                db.close();
            } catch { }
        }

        // ========== 递归搜索 base64 ==========
        // ========== Gemini payload and response parsing ==========
        function dataUrlToGeminiPart(dataUrl) {
            const [meta, data] = String(dataUrl).split(',');
            const mimeType = (meta.match(/^data:([^;]+)/) || [])[1] || 'image/jpeg';
            return { inlineData: { mimeType, data } };
        }

        function extractBase64AsDataUrl(dataObj) {
            if (dataObj == null) return null;
            if (Array.isArray(dataObj)) {
                for (const item of dataObj) {
                    const found = extractBase64AsDataUrl(item);
                    if (found) return found;
                }
            } else if (typeof dataObj === 'object') {
                const inlineData = dataObj.inlineData || dataObj.inline_data;
                if (inlineData?.data) {
                    const mimeType = inlineData.mimeType || inlineData.mime_type || 'image/png';
                    return `data:${mimeType};base64,${inlineData.data}`;
                }
                for (const value of Object.values(dataObj)) {
                    const found = extractBase64AsDataUrl(value);
                    if (found) return found;
                }
            }
            return null;
        }

        async function buildPayload() {
            const prompt = els.prompt.value.trim();
            const parts = refImages.map((ref) => dataUrlToGeminiPart(ref.dataUrl));
            parts.push({ text: refImages.length > 0 ? `请根据这些参考图片进行编辑或重绘：${prompt}` : prompt });
            return {
                contents: [{ role: 'user', parts }],
                generationConfig: { responseModalities: ['TEXT', 'IMAGE'] },
            };
        }

        // ========== 核心：发送请求 ==========
        function buildProviderRequest(baseUrl, model, apiKey) {
            const modelPath = model.startsWith('models/') ? model : 'models/' + model;
            return {
                url: `${baseUrl}/${modelPath}:generateContent`,
                headers: { 'x-goog-api-key': apiKey, 'Content-Type': 'application/json' },
            };

        function showGeneratedImage(dataUrl, prompt, startTime) {
            resultDataUrl = dataUrl;
            resultBlob = null;
            let sizeStr = '远程图片';

            if (dataUrl.startsWith('data:')) {
                const [meta, b64] = dataUrl.split(',');
                const mimeType = (meta.match(/^data:([^;]+)/) || [])[1] || 'image/png';
                const byteChars = atob(b64);
                const bytes = new Uint8Array(byteChars.length);
                for (let i = 0; i < byteChars.length; i++) bytes[i] = byteChars.charCodeAt(i);
                resultBlob = new Blob([bytes], { type: mimeType });
                const sizeKB = (bytes.length / 1024).toFixed(1);
                sizeStr = sizeKB > 1024 ? (sizeKB / 1024).toFixed(1) + ' MB' : sizeKB + ' KB';
            }

            stopTimer();
            els.loadingMini.classList.remove('active');
            els.resultImg.src = dataUrl;
            els.resultArea.classList.add('active');
            els.resultStats.textContent = `尺寸 ${els.resultImg.naturalWidth || '?'} x ${els.resultImg.naturalHeight || '?'}  ·  大小 ${sizeStr}  ·  用时 ${((Date.now() - startTime) / 1000).toFixed(1)}s`;

            unlockInputs();

            els.genBtn.textContent = '重新生成';
            const mode = refImages.length > 0 ? 2 : 1;
            const refUrl = refImages.length > 0 ? refImages[0].dataUrl : null;
            addToGallery(dataUrl, prompt, mode, refUrl);
            clearRefImages();
        }

        async function generate() {
            const apiKey = els.apiKey.value.trim();
            if (!apiKey) { alert('请填写 API Key'); return; }

            let baseUrl;
            try { baseUrl = normalizeBaseUrl(els.baseUrl.value); }
            catch (e) { alert(e.message); return; }

            const model = els.model.value.trim();
            if (!model) { alert('请填写或选择 Model'); return; }

            const prompt = els.prompt.value.trim();
            if (!prompt) { alert('请填写提示词'); return; }

            saveSettings();

            let payload;
            try { payload = await buildPayload(); }
            catch (e) { alert(e.message); return; }

            resetUI();
            lockInputs();
            els.genBtn.disabled = true;
            els.genBtn.textContent = '生成中…';
            els.loadingMini.classList.add('active');
            els.statEvents.textContent = '事件: 0';
            els.statTextLen.textContent = '文本: 0 字';
            startTimer();

            const requestInfo = buildProviderRequest(baseUrl, model, apiKey);
            appendEvent('event', `开始请求 POST ${new URL(requestInfo.url).pathname}`);

            try {
                const response = await fetch(requestInfo.url, { method: 'POST', headers: requestInfo.headers, body: JSON.stringify(payload) });
                if (!response.ok) {
                    let errText = '';
                    try { errText = await response.text(); } catch { }
                    stopTimer();
                    els.loadingMini.classList.remove('active');
                    unlockInputs();
                    els.genBtn.disabled = false;
                    els.genBtn.textContent = '重新生成';
                    appendEvent('event', `HTTP请求失败 ${response.status} — ${errText}`);
                    els.statusBar.className = 'status-bar err';
                    els.statusBar.textContent = `请求失败！HTTP ${response.status}${errText ? '\n' + errText.slice(0, 500) : ''}`;
                    return;
                }

                const data = await response.json();
                appendEvent('data', '收到 JSON 响应');
                const dataUrl = extractBase64AsDataUrl(data);
                if (dataUrl) {
                    showGeneratedImage(dataUrl, prompt, startTime);
                    return;
                }

                stopTimer();
                els.loadingMini.classList.remove('active');
                unlockInputs();
                els.genBtn.disabled = false;
                els.genBtn.textContent = '重新生成';
                els.statusBar.className = 'status-bar err';
                els.statusBar.textContent = '响应成功，但未找到图片数据。请检查模型是否支持图片输出。';
                appendEvent('done', '响应中未找到图片数据');
            } catch (err) {
                stopTimer();
                els.loadingMini.classList.remove('active');
                unlockInputs();
                els.genBtn.disabled = false;
                els.genBtn.textContent = '重新生成';
                appendEvent('event', `异常: ${err.message || err}`);
                els.statusBar.className = 'status-bar err';
                els.statusBar.textContent = '发生异常：' + (err.message || err) + '\n提示：浏览器直连第三方 API 可能会被 CORS 拦截，必要时请使用后端代理。';
            }
        }

                setTimeout(() => { els.copyBtn.textContent = orig; }, 1500);
            } catch {
                alert('复制失败，浏览器可能不支持。请用下载替代。');
            }
        }

        // ========== 图片预览（点击放大 / ESC 关闭 / 滚轮缩放 / 拖拽平移） ==========
        let previewScale = 1;
        let panX = 0, panY = 0;
        let isDragging = false;
        let dragStartX = 0, dragStartY = 0;
        let panStartX = 0, panStartY = 0;

        function updatePreviewTransform() {
            els.previewImg.style.transform = `translate(${panX}px, ${panY}px) scale(${previewScale})`;
        }

        function openPreview() {
            if (!resultDataUrl) return;
            previewScale = 1;
            panX = 0;
            panY = 0;
            els.previewImg.src = resultDataUrl;
            updatePreviewTransform();
            els.previewOverlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closePreview() {
            els.previewOverlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        els.resultImg.addEventListener('click', openPreview);
        els.previewOverlay.addEventListener('click', (e) => {
            if (e.target === els.previewOverlay || e.target.classList.contains('preview-close')) {
                closePreview();
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && els.previewOverlay.classList.contains('open')) {
                closePreview();
            }
        });

        // 滚轮缩放（以鼠标位置为锚点）
        els.previewOverlay.addEventListener('wheel', (e) => {
            if (!els.previewOverlay.classList.contains('open')) return;
            e.preventDefault();

            const rect = els.previewImg.getBoundingClientRect();
            const fx = (e.clientX - rect.left) / rect.width;
            const fy = (e.clientY - rect.top) / rect.height;

            const oldScale = previewScale;
            previewScale = Math.max(0.2, Math.min(5, previewScale + (e.deltaY > 0 ? -0.1 : 0.1)));

            const ratio = previewScale / oldScale;
            const newLeft = e.clientX - fx * rect.width * ratio;
            const newTop = e.clientY - fy * rect.height * ratio;

            panX += newLeft - rect.left;
            panY += newTop - rect.top;
            updatePreviewTransform();
        });

        // 拖拽平移
        els.previewImg.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            isDragging = true;
            els.previewImg.classList.add('dragging');
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            panStartX = panX;
            panStartY = panY;
            e.preventDefault();
        });
        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = panStartX + (e.clientX - dragStartX);
            panY = panStartY + (e.clientY - dragStartY);
            updatePreviewTransform();
        });
        window.addEventListener('mouseup', () => {
            if (!isDragging) return;
            isDragging = false;
            els.previewImg.classList.remove('dragging');
        });

        // ========== 事件绑定 ==========
        els.genBtn.addEventListener('click', generate);
        els.editBtn.addEventListener('click', editCurrentImage);
        els.downloadBtn.addEventListener('click', download);
        els.copyBtn.addEventListener('click', copyImage);
        els.prompt.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') generate();
        });

        // ========== Model 下拉（聚焦时拉取模型列表） ==========
        function renderModelPanel() {
            els.modelPanel.innerHTML = '';
            if (!modelIds.length) {
                const empty = document.createElement('div');
                empty.className = 'combo-empty';
                empty.textContent = '聚焦自动加载模型列表，需先填 Base URL 和 API Key';
                els.modelPanel.appendChild(empty);
                return;
            }
            modelIds.forEach((id, i) => {
                const item = document.createElement('div');
                item.className = 'combo-item' + (i === activeModelIdx ? ' active' : '');
                item.textContent = id;
                item.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    els.model.value = id;
                    closeModelPanel();
                });
                els.modelPanel.appendChild(item);
            });
        }

        function openModelPanel() { activeModelIdx = -1; renderModelPanel(); els.modelPanel.classList.add('open'); }
        function closeModelPanel() { els.modelPanel.classList.remove('open'); }

        async function loadModels() {
            let baseUrl;
            try { baseUrl = normalizeBaseUrl(els.baseUrl.value); }
            catch { return; }
            modelIds = [];
            renderModelPanel();
            const firstKey = els.apiKey.value.trim();
            if (!firstKey) return;
            const cacheKey = baseUrl + '::' + firstKey;
            if (modelCache.has(cacheKey)) {
                modelIds = modelCache.get(cacheKey);
                renderModelPanel();
                return;
            }
            try {
                const resp = await fetch(baseUrl + '/models', {
                    headers: { 'x-goog-api-key': firstKey, 'Content-Type': 'application/json' },
                });
                if (resp.ok) {
                    const data = await resp.json();
                    const allIds = Array.isArray(data?.models) ? data.models.map((m) => m?.name || m?.id).filter(Boolean) : [];
                    modelIds = [...new Set(allIds.map(normalizeModelId).filter(Boolean))];
                    modelCache.set(cacheKey, modelIds);
                }
            } catch { }
            renderModelPanel();
        }

        els.model.addEventListener('focus', () => { openModelPanel(); loadModels(); });
        els.model.addEventListener('input', () => { activeModelIdx = -1; renderModelPanel(); els.modelPanel.classList.add('open'); });
        els.model.addEventListener('blur', () => setTimeout(closeModelPanel, 150));
        els.model.addEventListener('keydown', (e) => {
            const items = els.modelPanel.querySelectorAll('.combo-item');
            if (e.key === 'ArrowDown') { e.preventDefault(); activeModelIdx = Math.min(items.length - 1, activeModelIdx + 1); renderModelPanel(); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); activeModelIdx = Math.max(0, activeModelIdx - 1); renderModelPanel(); }
            else if (e.key === 'Enter' && activeModelIdx >= 0 && items[activeModelIdx]) { e.preventDefault(); els.model.value = items[activeModelIdx].textContent; closeModelPanel(); }
            else if (e.key === 'Escape') { closeModelPanel(); }
        });
        // ========== End Model 下拉 ==========
    </script>
</body>

</html>
